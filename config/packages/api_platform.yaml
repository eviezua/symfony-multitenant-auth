api_platform:
    title: Hello API Platform
    version: 1.0.0
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
            AccountID:
                name: Account-ID
                type: header
    formats:
        json: [ 'application/json' ]
        jsonld: [ 'application/ld+json' ]
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
