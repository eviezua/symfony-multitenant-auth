services:
    nginx:
        build:
            args:
                VERSION: ${NGINX_VERSION:-1.30-alpine}
            context: .
            dockerfile: ./docker/nginx/Dockerfile
        volumes:
            - ./public:/app/public
        depends_on:
            - php-fpm
        ports:
            - "80:80"
            - "443:443"

    php-fpm:
        build:
            args:
                VERSION: ${PHP_VERSION:-8.4}
            context: .
            dockerfile: ./docker/php-fpm/Dockerfile
            target: dev
        volumes:
            - ./:/app
        command: |
            sh -c 'XDEBUG_MODE=off composer install --no-interaction --optimize-autoloader && php-fpm'
        depends_on:
            - database

    database:
        image: postgres:${POSTGRES_VERSION:-16}-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symfony}
            POSTGRES_USER: ${POSTGRES_USER:-symfony}
        ports:
            - "55432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data:rw
volumes:
    db-data:
